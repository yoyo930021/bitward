[package]
name = "nsh-app-bitward-gui"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# 跟隨 spike/nsh-spike 慣例：獨立 cargo workspace（契約 §0.2 NSH 裁決）。
[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
# BTP 型別單一來源；GUI 零業務邏輯，分級/過濾語意全在 daemon（契約 §2.5）。
bw-proto = { path = "../../crates/bw-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
# shots 驗收流算即時 TOTP（2FA 登入流）；正式路徑的碼在 daemon 端算。
hmac = "0.12"
sha1 = "0.10"
# favicon data: URI 編碼（批次 C；版本同 workspace）。
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# nsh-platform-macos 再匯出 objc2 棧；`nsh run` 組 app lib 時會剝掉
# target 區塊、只注入它自己，所以直接依賴 objc2 會斷，必須經此再匯出
# （spike FINDINGS「打包鏈問題」）。
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
