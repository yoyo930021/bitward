			name = "Stage bitwarderd";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nREPO=\"$SRCROOT/../..\"\n# 固定取 release（開發期需先 cargo build --release；debug 優先曾讓\n# 舊 release 被 debug 覆蓋造成兩次殭屍二進位上崗）。\nSRC=\"$REPO/target/release/bitwarderd\"\nif [ -x \"$SRC\" ]; then\n  DEST=\"$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Helpers\"\n  mkdir -p \"$DEST\"\n  cp -f \"$SRC\" \"$DEST/bitwarderd\"\n  # team 簽章 + app-group entitlement：macOS 15+ 的 group container\n  # 只放行「有 team 身分且宣告對應 group」的進程（ad-hoc 會 EPERM）。\n  # -i io.bitward.dev.daemon：沙盒容器的鍵需 reverse-DNS 識別碼\n  #（SMAppService 政策要求 helper 沙盒化，見 FINDINGS §10）。\n  codesign -f -s \"$EXPANDED_CODE_SIGN_IDENTITY\" -i io.bitward.dev.daemon \\\n    --entitlements \"$SRCROOT/../../bins/bitwarderd/helper.entitlements\" \\\n    \"$DEST/bitwarderd\"\nelse\n  echo \"warning: bitwarderd not found (cargo build first)\"\nfi\n# 沙盒化 SMAppService daemon：嵌套 BitwardDaemon.app（裸二進位沙盒化會\n# 死在 dyld secinit；沙盒容器需要 bundle 身分，FINDINGS §10）。\nif [ -x \"$SRC\" ]; then\n  DA=\"$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Helpers/BitwardDaemon.app\"\n  rm -rf \"$DA\"; mkdir -p \"$DA/Contents/MacOS\"\n  cp -f \"$SRC\" \"$DA/Contents/MacOS/bitwarderd\"\n  cp -f \"$SRCROOT/Bitward/Resources/BitwardDaemon-Info.plist\" \"$DA/Contents/Info.plist\"\n  codesign -f -s \"$EXPANDED_CODE_SIGN_IDENTITY\" -i io.bitward.dev.daemon \\\n    --entitlements \"$SRCROOT/../../bins/bitwarderd/daemon.entitlements\" \\\n    \"$DA/Contents/MacOS/bitwarderd\"\n  codesign -f -s \"$EXPANDED_CODE_SIGN_IDENTITY\" -i io.bitward.dev.daemon \\\n    --entitlements \"$SRCROOT/../../bins/bitwarderd/daemon.entitlements\" \"$DA\"\nfi\n# SMAppService.agent(plistName:) 規定 plist 在 Contents/Library/LaunchAgents/\n# 先清空再拷：增量建置不刪舊檔，殘留的 io.bitward.daemon.plist（不合規\n# Label）讓 register 對整個目錄拋 EINVAL（2026-11-07 pkg 實驗實測）。\nLA=\"$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Library/LaunchAgents\"\nrm -rf \"$LA\"\nmkdir -p \"$LA\"\ncp -f \"$SRCROOT/Bitward/Resources/io.bitward.dev.daemon.plist\" \"$LA/io.bitward.dev.daemon.plist\"\n";
		};
/* End PBXShellScriptBuildPhase section */

