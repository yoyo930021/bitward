# Bitward macOS：容器 App + credential provider extension。
# 重新生成：`xcodegen generate`（本檔是唯一事實來源，Info.plist 檔頭也由此處 settings 引用）。
name: Bitward
options:
  bundleIdPrefix: io.bitward
  deploymentTarget:
    macOS: "14.0" # ASPasswordCredentialRequest 的 availability 下限（research/macos-provider.md §0）
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    # 正常簽章鏈（P5 真機驗證）：免費 Apple Development 身分即可承載受限 entitlement。
    # ad-hoc 教訓保留在 FINDINGS.md：無 Team ID 時 XCBuild 索求 profile、launchd INIT 163。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 8V5224A99M
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Bitward:
    type: application
    platform: macOS
    sources:
      - Bitward/Sources
      - path: Bitward/Resources
        buildPhase: none
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bitward.dev
        PRODUCT_NAME: Bitward
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_FILE: Bitward/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bitward/Bitward.entitlements
        PROVISIONING_PROFILE_SPECIFIER: Bitward Mac Dev
    postCompileScripts:
      # 把 daemon 打进 bundle（Contents/Helpers）供 LaunchAgent 使用。
      # alwaysOutOfDate：staged 二進位不在 Xcode 依賴圖裡，增量建置曾兩次
      # 讓舊 bitwarderd 悄悄上崗（真機教訓），故每回合強制重拷＋重簽。
      - name: Stage bitwarderd
        script: |
          set -e
          REPO="$SRCROOT/../.."
          # 固定取 release（開發期需先 cargo build --release；debug 優先曾讓
          # 舊 release 被 debug 覆蓋造成兩次殭屍二進位上崗）。
          SRC="$REPO/target/release/bitwarderd"
          if [ -x "$SRC" ]; then
            DEST="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Helpers"
            mkdir -p "$DEST"
            cp -f "$SRC" "$DEST/bitwarderd"
            # team 簽章 + app-group entitlement：macOS 15+ 的 group container
            # 只放行「有 team 身分且宣告對應 group」的進程（ad-hoc 會 EPERM）。
            codesign -f -s "$EXPANDED_CODE_SIGN_IDENTITY" \
              --entitlements "$SRCROOT/../../bins/bitwarderd/helper.entitlements" \
              "$DEST/bitwarderd"
          else
            echo "warning: bitwarderd not found (cargo build first)"
          fi
          # SMAppService.agent(plistName:) 規定 plist 在 Contents/Library/LaunchAgents/
          # 先清空再拷：增量建置不刪舊檔，殘留的 io.bitward.daemon.plist（不合規
          # Label）讓 register 對整個目錄拋 EINVAL（2026-11-07 pkg 實驗實測）。
          LA="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME/Contents/Library/LaunchAgents"
          rm -rf "$LA"
          mkdir -p "$LA"
          cp -f "$SRCROOT/Bitward/Resources/io.bitward.dev.daemon.plist" "$LA/io.bitward.dev.daemon.plist"
        # 不宣告 outputFiles：xcodegen 版不支援 alwaysOutOfDate，改用「無輸出
        # 宣告」讓 Xcode 每回合都跑此腳本（殭屍二進位教訓，見 FINDINGS §7）。
    dependencies:
      - target: BitwardProvider
  BitwardProvider:
    type: app-extension
    platform: macOS
    sources:
      - BitwardProvider/Sources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bitward.dev.provider
        PRODUCT_NAME: BitwardProvider
        INFOPLIST_FILE: BitwardProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: BitwardProvider/BitwardProvider.entitlements
        PROVISIONING_PROFILE_SPECIFIER: BitwardProvider Mac Dev
schemes:
  Bitward:
    build:
      targets:
        Bitward: all
    run:
      config: Debug
      target: Bitward
