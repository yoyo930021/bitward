# Bitward macOS：容器 App + credential provider extension。
# 重新生成：`xcodegen generate`（本檔是唯一事實來源，Info.plist 檔頭也由此處 settings 引用）。
name: Bitward
options:
  bundleIdPrefix: io.bitward
  deploymentTarget:
    macOS: "14.0" # ASPasswordCredentialRequest 的 availability 下限（research/macos-provider.md §0）
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    # 正常簽章鏈（P5 真機驗證）：免費 Apple Development 身分即可承載受限 entitlement。
    # ad-hoc 教訓保留在 FINDINGS.md：無 Team ID 時 XCBuild 索求 profile、launchd INIT 163。
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 7Z94595PW7
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Bitward:
    type: application
    platform: macOS
    sources:
      - Bitward/Sources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bitward.dev
        PRODUCT_NAME: Bitward
        INFOPLIST_FILE: Bitward/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bitward/Bitward.entitlements
    dependencies:
      - target: BitwardProvider
  BitwardProvider:
    type: app-extension
    platform: macOS
    sources:
      - BitwardProvider/Sources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bitward.dev.provider
        PRODUCT_NAME: BitwardProvider
        INFOPLIST_FILE: BitwardProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: BitwardProvider/BitwardProvider.entitlements
schemes:
  Bitward:
    build:
      targets:
        Bitward: all
    run:
      config: Debug
      target: Bitward
