[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-3-Clause", "BSD-2-Clause", "CC0-1.0", "Unicode-3.0", "Zlib", "MPL-2.0", "GPL-3.0-or-later", "GPL-3.0-only", "LGPL-3.0-or-later", "OpenSSL", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
deny = [
    # 授權硬牆：不得鏈接任何官方 bitwarden-* SDK crate（契約 §0、A9）
    { name = "bitwarden-crypto" },
    { name = "bitwarden-core" },
    { name = "bitwarden-api-api" },
    { name = "bitwarden-api-identity" },
    { name = "bitwarden-sdk" },
]
