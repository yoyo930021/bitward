[package]
name = "nsh-app-nsh-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
# 契約 §2 型別的單一來源：spike 只讀，不改 bw-proto
bw-proto = { path = "../../crates/bw-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# nsh-platform-macos 再匯出 objc2 棧；`nsh run` 組 app lib 時會剝掉
# target 區塊、只注入它自己，所以直接依賴 objc2 會斷，必須經此再匯出。
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
