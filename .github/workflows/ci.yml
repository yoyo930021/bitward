name: CI
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  compat:
    runs-on: ubuntu-latest
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.2
        env:
          # 服務容器無持久卷；VW 缺這個旗標會拒絕啟動（readpath e2e 同源教訓）
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "50"
        ports: ["8080:80"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: server compat (fixture replay)
        run: cargo nextest run -p bw-server
      - name: live Vaultwarden e2e
        env:
          BITWARD_E2E_SERVER: http://localhost:8080
        run: cargo nextest run -p bw-server --features e2e

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  readpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/readpath.sh

  writepath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/writepath.sh

  vaulttypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/vaulttypes.sh

  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/attachments.sh

  autodrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/autodrain.sh

  agentpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward -p bitward-mcp
      - run: ./dev/e2e/agentpath.sh

  datamanagement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/datamanagement.sh

  orgpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # orgflow 的 type-2 信封/RSA-OAEP 用 python cryptography（ubuntu runner 內建 pip 可裝）
      - run: python3 -c "import cryptography" || pip install --break-system-packages cryptography
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/orgpath.sh

  remotepath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/remotepath.sh
