name: CI
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  compat:
    runs-on: ubuntu-latest
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.2
        env:
          # 服務容器無持久卷；VW 缺這個旗標會拒絕啟動（readpath e2e 同源教訓）
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "50"
        ports: ["8080:80"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: server compat (fixture replay)
        run: cargo nextest run -p bw-server
      - name: live Vaultwarden e2e
        env:
          BITWARD_E2E_SERVER: http://localhost:8080
        run: cargo nextest run -p bw-server --features e2e

  # 體制閘：GUI workspace（apps/bitward-gui，獨立 cargo workspace）在 macOS 的
  # 編譯＋單測＋fmt 閘。教訓：6f057a6 期間 GUI crate 於 HEAD 括號破口 rc=1 無人擋
  # （root workspace 不含 apps/*，linux-gui 又只驗 Linux 面）。
  gui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt gate (GUI workspace)
        working-directory: apps/bitward-gui
        run: cargo fmt --check
      - name: compile gate
        working-directory: apps/bitward-gui
        run: cargo check --all-targets
      - name: unit tests
        working-directory: apps/bitward-gui
        run: cargo test --lib

  # 體制閘：Android workspace（apps/bitward-android，獨立 cargo workspace）host 態
  # 編譯＋單測。教訓：PR1 6f895c7 給 CipherDraft 加 card/identity 未跟 Android 構造點，
  # root workspace 不含 apps/*、gui 閘只罩 bitward-gui，兩處 E0063 在 HEAD 掛了整天
  # 無任何 job 擋。`--all-targets` 連 cfg(test) 構造點一起罩（同型第三處就在測內）。
  # fmt 暫不入閘：該檔既存大量歷史 fmt diff（86 處），整刷另批處理。
  android-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: compile gate
        working-directory: apps/bitward-android
        run: cargo check -q --all-targets
      - name: unit tests
        working-directory: apps/bitward-android
        run: cargo test -q --lib

  # PR6-E1：Linux 全 workspace（Q3/systemd 落地後，crates/bins 必須在 Linux 全綠；
  # 之前 Linux 只驗 bw-server＋選定 e2e，bw-keys/bw-store/bw-agent 單測從未上過 Linux）。
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  readpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/readpath.sh

  writepath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/writepath.sh

  vaulttypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/vaulttypes.sh

  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/attachments.sh

  autodrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/autodrain.sh

  agentpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward -p bitward-mcp
      - run: ./dev/e2e/agentpath.sh

  datamanagement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/datamanagement.sh

  orgpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # orgflow 的 type-2 信封/RSA-OAEP 用 python cryptography（ubuntu runner 內建 pip 可裝）
      - run: python3 -c "import cryptography" || pip install --break-system-packages cryptography
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/orgpath.sh

  remotepath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/remotepath.sh

  # PR6-E2：nsh-platform-linux（GTK4）建置閘。半天 spike 四屏親跑通過
  # （OrbStack ubuntu 24.04：主列表/詳情/鎖屏/解鎖閉環全渲染，見 docs/research/nsh-linux.md）；
  # CI 驗編譯＋單元測（不起窗，runner 無 X）。
  linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - working-directory: apps/bitward-gui
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: apps/bitward-gui
        run: cargo test

  # PR6-E3：推播路徑（PushCall 帳、APNs JWT 形狀、410 卸載收斂）入 CI——
  # P5 至今只在本地跑過；mock APNs 是本機 http.server，無 docker 依賴，ubuntu 直跑。
  pushpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/pushpath.sh

  # PR6-E5：單 daemon 多 profile 的隔離三斷言＋併發 sync perf 框（Lane 9 的 CI 面）。
  # 自架 Vaultwarden 服務容器，兩個 VW 帳號同 daemon 兩槽。
  multiaccount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p bitwarderd -p bitward
      - run: ./dev/e2e/multiaccount.sh
